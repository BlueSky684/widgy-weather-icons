name: Update Widgy Date Glass

on:
  schedule:
    # Two daily checks cover both Israel summer time (UTC+3) and winter time (UTC+2).
    # The script itself uses Asia/Jerusalem and only commits when the day actually changed.
    - cron: "5 21 * * *"
    - cron: "5 22 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Optional test day (auto = current day in Israel)"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - sun
          - mon
          - tue
          - wed
          - thu
          - fri
          - sat

permissions:
  contents: write

concurrency:
  group: widgy-date-glass
  cancel-in-progress: true

jobs:
  update-date-glass:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Build selected_date_current.png
        env:
          DAY_OVERRIDE: ${{ inputs.day || 'auto' }}
        run: |
          python - <<'PY'
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from PIL import Image, ImageChops
          import os
          import sys

          source = Path("selected_date_glass.png")
          output = Path("selected_date_current.png")

          # Exact calibrated positions inside the 1008Ã128 transparent strip.
          # 0=SUN, 1=MON, ... 6=SAT
          positions = [0, 147, 293, 440, 587, 733, 880]
          labels = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"]

          override_map = {
              "sun": 0,
              "mon": 1,
              "tue": 2,
              "wed": 3,
              "thu": 4,
              "fri": 5,
              "sat": 6,
          }

          override = os.environ.get("DAY_OVERRIDE", "auto").strip().lower()

          if override == "auto":
              # Python weekday: Monday=0 ... Sunday=6.
              # Convert to Sunday=0 ... Saturday=6.
              weekday = (datetime.now(ZoneInfo("Asia/Jerusalem")).weekday() + 1) % 7
          elif override in override_map:
              weekday = override_map[override]
          else:
              raise SystemExit(f"Unknown DAY_OVERRIDE: {override}")

          if not source.exists():
              raise SystemExit("selected_date_glass.png was not found in the repository root.")

          approved = Image.open(source).convert("RGBA")
          if approved.size != (128, 128):
              raise SystemExit(
                  f"selected_date_glass.png must be 128Ã128, got {approved.size}."
              )

          canvas = Image.new("RGBA", (1008, 128), (0, 0, 0, 0))
          canvas.alpha_composite(approved, (positions[weekday], 0))

          # Do not rewrite/commit the file when the visible pixels did not change.
          if output.exists():
              try:
                  old = Image.open(output).convert("RGBA")
                  if old.size == canvas.size and ImageChops.difference(old, canvas).getbbox() is None:
                      print(f"No change needed. Glass is already on {labels[weekday]}.")
                      sys.exit(0)
              except Exception:
                  pass

          canvas.save(output, optimize=True)
          print(f"Updated {output} -> {labels[weekday]} (Israel time).")
          PY

      - name: Commit only when the PNG changed
        run: |
          if git diff --quiet -- selected_date_current.png; then
            echo "selected_date_current.png is already correct."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add selected_date_current.png
          git commit -m "Update Widgy date glass"
          git push
