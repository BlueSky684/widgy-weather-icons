name: Update Widgy Date Glass

on:
  schedule:
    # GitHub Actions cron is UTC.
    # We cover both Israel DST states (UTC+3 / UTC+2), then the script below
    # permits work only at the requested Israel-local times:
    # 00:00, 00:05, 00:10, 00:20, 00:40, 01:00.
    - cron: "0,5,10,20,40 21 * * *"
    - cron: "0,5,10,20,40 22 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: widgy-date-glass-single-output
  cancel-in-progress: true

jobs:
  update-date-glass:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Check Israel-local update window
        id: local_time_gate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os

          now = datetime.now(ZoneInfo("Asia/Jerusalem"))
          allowed = {(0, 0), (0, 5), (0, 10), (0, 20), (0, 40), (1, 0)}
          event = os.environ.get("GITHUB_EVENT_NAME", "")
          should_run = event == "workflow_dispatch" or (now.hour, now.minute) in allowed

          print(f"should_run={'true' if should_run else 'false'}")
          print(f"Israel local time: {now.isoformat(timespec='seconds')}", file=os.sys.stderr)
          PY

      - name: Build single dynamic selected_date_current.png
        if: steps.local_time_gate.outputs.should_run == 'true'
        env:
          APPROVED_GLASS_B64: ""
        run: |
          python - <<'PY'
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from PIL import Image
          import base64, hashlib, io, json, os

          now = datetime.now(ZoneInfo("Asia/Jerusalem"))
          weekday = (now.weekday() + 1) % 7  # SUN=0 ... SAT=6

          # Calibrated seven-cell strip from the previously working mechanism.
          positions = [0, 158, 317, 475, 633, 792, 950]
          labels = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"]
          width, height = 1078, 128

          approved_bytes = base64.b64decode(os.environ["APPROVED_GLASS_B64"])
          approved = Image.open(io.BytesIO(approved_bytes)).convert("RGBA")

          if approved.size != (128, 128):
              raise SystemExit(f"Embedded glass must be 128x128; got {approved.size}")

          canvas = Image.new("RGBA", (width, height), (0, 0, 0, 0))
          canvas.alpha_composite(approved, (positions[weekday], 0))

          output = Path("selected_date_current.png")
          canvas.save(output, format="PNG", optimize=True)

          state = {
              "date": now.strftime("%Y-%m-%d"),
              "weekday": labels[weekday],
              "timezone": "Asia/Jerusalem",
              "asset": output.name,
              "sha256": hashlib.sha256(output.read_bytes()).hexdigest()
          }
          Path("selected_date_state.json").write_text(
              json.dumps(state, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          print(json.dumps(state, ensure_ascii=False))
          PY

      - name: Validate generated PNG
        if: steps.local_time_gate.outputs.should_run == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          p = Path("selected_date_current.png")
          if not p.exists():
              raise SystemExit("selected_date_current.png was not generated.")

          with Image.open(p) as im:
              rgba = im.convert("RGBA")
              if rgba.size != (1078, 128):
                  raise SystemExit(f"Unexpected output size: {rgba.size}")
              if rgba.getchannel("A").getbbox() is None:
                  raise SystemExit("Generated output is fully transparent.")

          print("selected_date_current.png validated.")
          PY

      - name: Commit changed output and state
        if: steps.local_time_gate.outputs.should_run == 'true'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f selected_date_current.png selected_date_state.json

          if git diff --cached --quiet; then
            echo "Date glass is already current."
            exit 0
          fi

          git commit -m "Update Widgy date glass"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify output on origin main
        if: steps.local_time_gate.outputs.should_run == 'true'
        run: |
          set -e
          git fetch origin main
          git show origin/main:selected_date_current.png >/dev/null
          git show origin/main:selected_date_state.json >/dev/null
          echo "Remote dynamic date glass confirmed."
